[package]
name = "mailbox_processor"
version = "0.2.0"
edition = "2021"

license = "LGPL-2.1-or-later" 
description = "A small little actor abstraction inspired by the FSharp Mailbox Processor which in turn was inspired by erlang "
homepage = "https://github.com/garydwatson/mailbox_processor"
repository = "https://github.com/garydwatson/mailbox_processor"
readme = "README.md"



# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
futures = "0.3.21"
thiserror = "1.0.30"
tokio = { version = "1.47.1", features = ["full"] }

[dev-dependencies]
futures = "0.3.21"
